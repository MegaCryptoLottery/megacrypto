        let audioCtx = null;
        let isMuted = localStorage.getItem('megacrypto_muted') === 'true';

        function initAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const SoundEngine = {
            playTone(freq, type, duration, gainVal = 0.1) {
                if (isMuted) return;
                try {
                    initAudioContext();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch (e) { }
            },
            numberClick(count) { this.playTone(300 + (count * 35), 'sine', 0.08, 0.08); },
            numberDeselect() { this.playTone(240, 'triangle', 0.08, 0.06); },
            quickPick() {
                if (isMuted) return;
                for (let i = 0; i < 6; i++) {
                    setTimeout(() => this.playTone(400 + Math.random() * 500, 'sine', 0.04, 0.05), i * 35);
                }
            },
            clearPick() { this.playTone(180, 'sine', 0.12, 0.08); },
            successTx() {
                if (isMuted) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.25, 0.1), i * 80);
                });
            },
            winFanfare() {
                if (isMuted) return;
                [440, 554.37, 659.25, 880, 1108.73].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.4, 0.15), i * 90);
                });
            },
            errorSound() { this.playTone(130, 'sawtooth', 0.2, 0.1); }
        };

            updateSoundBtn();

        function setLanguage(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(translations[lang] && translations[lang][key]) el.innerText = translations[lang][key];
            });
            localStorage.setItem('megacrypto_lang', lang);
        }

        document.getElementById('langSelector').onchange = (e) => setLanguage(e.target.value);

        function verificarAntiPhishing() {
            const currentHost = window.location.hostname;
            const badge = document.getElementById('officialUrlBadge');
            if (badge) badge.innerText = currentHost || "megacryptolottery.github.io";

            const banner = document.getElementById('securityBanner');
            if (banner && currentHost && !currentHost.includes("github.io") && !currentHost.includes("localhost") && !currentHost.includes("127.0.0.1")) {
                banner.className = "w-full bg-red-950/90 border-b border-red-500 px-3 py-2 text-xs flex items-center justify-center gap-2 text-red-200";
                banner.innerHTML = "⚠️ <b>ALERTA DE SEGURANÇA:</b> Você pode estar em uma cópia não autorizada! Verifique o domínio oficial.";
            }
        }

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.setHeaderColor) tg.setHeaderColor('#030303');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#030303');
        }

        let provider, signer, userAddress;
        let lotteryContract, usdtContract;

        async function getPublicContract(chainId = 137) {
            const net = NETWORKS[chainId] || NETWORKS[137];
            try {
                const p = new ethers.JsonRpcProvider(net.rpc);
                const c = new ethers.Contract(net.contract, LOTTERY_ABI, p);
                await p.getBlockNumber();
                return c;
            } catch(e) {}
            return new ethers.Contract(net.contract, LOTTERY_ABI, new ethers.JsonRpcProvider(net.rpc));
        }

        async function connectWallet() {
            try {
                const ethProvider = window.ethereum || window.coinbaseWalletExtension;
                if (!ethProvider) {
                    const rawUrl = window.location.href.replace(/^https?:\/\//, '');
                    const metamaskUrl = `https://metamask.app.link/dapp/${rawUrl}`;
                    if (window.Telegram?.WebApp?.openLink) {
                        window.Telegram.WebApp.openLink(metamaskUrl);
                    } else {
                        window.location.href = metamaskUrl;
                    }
                    return;
                }

                provider = new ethers.BrowserProvider(ethProvider);
                const network = await provider.getNetwork();
                const chainId = Number(network.chainId);

                if (!NETWORKS[chainId]) {
                    document.getElementById('networkWarningBanner').classList.remove('hidden');
                    SoundEngine.errorSound();
                    return; 
                } else {
                    document.getElementById('networkWarningBanner').classList.add('hidden');
                }

                currentChainId = chainId;
                updateNetworkBadge(chainId);

                await provider.send("eth_requestAccounts", []);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                
                const activeNet = NETWORKS[chainId];
                lotteryContract = new ethers.Contract(activeNet.contract, LOTTERY_ABI, signer);
                usdtContract = new ethers.Contract(activeNet.usdt, ERC20_ABI, signer);

                updateConnectedUI(userAddress);
                await carregarMinhasApostas();
                await verificarPremioDisponivel();
                await carregarDadosPublicos();
                SoundEngine.successTx();

                if (window.ethereum && window.ethereum.on && !window._chainListenerAttached) {
                    window._chainListenerAttached = true;
                    window.ethereum.on('chainChanged', async (newChainIdHex) => {
                        const newChainId = Number(newChainIdHex);
                        if (NETWORKS[newChainId]) {
                            currentChainId = newChainId;
                            updateNetworkBadge(newChainId);
                            
                            provider = new ethers.BrowserProvider(window.ethereum);
                            signer = await provider.getSigner();
                            userAddress = await signer.getAddress();
                            
                            const activeNet = NETWORKS[newChainId];
                            lotteryContract = new ethers.Contract(activeNet.contract, LOTTERY_ABI, signer);
                            usdtContract = new ethers.Contract(activeNet.usdt, ERC20_ABI, signer);

                            updateConnectedUI(userAddress);
                            await carregarMinhasApostas();
                            await verificarPremioDisponivel();
                            await carregarDadosPublicos();
                        } else {
                            window.location.reload();
                        }
                    });
                }

            } catch (error) {
                console.log("Erro de conexão:", error);
                SoundEngine.errorSound();
            }
        }

        async function switchNetwork(targetChainId) {
            try {
                const hexChainId = '0x' + targetChainId.toString(16);
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: hexChainId }],
                });
                document.getElementById('networkWarningBanner').classList.add('hidden');
            } catch (switchError) {
                alert("Por favor, altere manualmente sua rede na carteira.");
            }
        }

        function updateNetworkBadge(chainId) {
            const badge = document.getElementById('activeNetworkBadge');
            const netName = document.getElementById('netName');
            const netDot = document.getElementById('netDot');
            const scanName = document.getElementById('scanName');
            
            badge.classList.remove('hidden');
            badge.classList.add('flex');
            
            if (chainId === 56) {
                netName.innerText = "BSC";
                netDot.className = "h-2 w-2 rounded-full bg-yellow-400 animate-pulse";
                scanName.innerText = "BscScan";
            } else if (chainId === 42161) {
                netName.innerText = "Arbitrum";
                netDot.className = "h-2 w-2 rounded-full bg-blue-400 animate-pulse";
                scanName.innerText = "Arbiscan";
            } else {
                netName.innerText = "Polygon";
                netDot.className = "h-2 w-2 rounded-full bg-purple-400 animate-pulse";
                scanName.innerText = "Polygonscan";
            }
        }

        document.getElementById('connectBtn').onclick = connectWallet;

        function updateConnectedUI(addr) {
            const btn = document.getElementById('connectBtn');
            btn.innerText = addr.slice(0,6) + "..." + addr.slice(-4);
            btn.classList.remove('btn-grad');
            btn.classList.add('bg-green-600');
        }

        async function carregarDadosPublicos() {
            try {
                const readLottery = await getPublicContract(currentChainId);
                const activeNet = NETWORKS[currentChainId];
                
                const [jackpotRaw, semanalRaw] = await Promise.all([
                    readLottery.jackpotAcumulado().catch(() => 0n),
                    readLottery.poolSemanal().catch(() => 0n)
                ]);

                document.getElementById('jackpotValue').innerText = parseFloat(ethers.formatUnits(jackpotRaw, activeNet.decimals)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                document.getElementById('weeklyValue').innerText = parseFloat(ethers.formatUnits(semanalRaw, activeNet.decimals)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                await carregarHistoricoPublico(readLottery);
                await atualizarCardsMultiChain();

            } catch (err) {
                console.error("Erro ao carregar dados on-chain públicos:", err);
            }
        }

        async function atualizarCardsMultiChain() {
            let globalTotalSum = 0;

            for (const [chainIdStr, net] of Object.entries(NETWORKS)) {
                const chainId = Number(chainIdStr);
                let jpFormatted = 0;
                let weeklyFormatted = 0;

                try {
                    const tempProvider = new ethers.JsonRpcProvider(net.rpc);
                    const tempContract = new ethers.Contract(net.contract, LOTTERY_ABI, tempProvider);
                    
                    const [jackpotRaw, semanalRaw] = await Promise.all([
                        tempContract.jackpotAcumulado().catch(() => 0n),
                        tempContract.poolSemanal().catch(() => 0n)
                    ]);
                    
                    jpFormatted = parseFloat(ethers.formatUnits(jackpotRaw, net.decimals));
                    weeklyFormatted = parseFloat(ethers.formatUnits(semanalRaw, net.decimals));

                    document.getElementById(`jpNet-${chainId}`).innerText = jpFormatted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    document.getElementById(`weeklyNet-${chainId}`).innerText = weeklyFormatted.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

                    globalTotalSum += jpFormatted + weeklyFormatted;
                } catch (e) {
                    console.error(`Erro ao buscar dados da rede ${net.name}:`, e);
                }

                const card = document.getElementById(`cardNet-${chainId}`);
                const statusBadge = document.getElementById(`statusNet-${chainId}`);
                const btn = document.getElementById(`btnNet-${chainId}`);

                if (chainId === currentChainId) {
                    card.className = "glass rounded-2xl p-4 border border-purple-500 bg-purple-500/10 flex flex-col justify-between transition-all shadow-[0_0_15px_rgba(168,85,247,0.15)]";
                    statusBadge.className = "text-[9px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold uppercase";
                    statusBadge.innerText = "Conectado Ativo";
                    btn.innerText = "Rede Atual";
                    btn.disabled = true;
                    btn.className = "w-full bg-emerald-600/20 text-emerald-400 font-bold text-xs py-2.5 rounded-xl border border-emerald-500/35 cursor-default";
                } else {
                    card.className = "glass rounded-2xl p-4 border border-white/10 flex flex-col justify-between transition-all hover:border-purple-500/40";
                    statusBadge.className = "text-[9px] px-2 py-0.5 rounded-full bg-white/10 text-gray-400 font-bold uppercase";
                    statusBadge.innerText = "Disponível";
                    btn.disabled = false;
                    btn.innerText = `Mudar para ${net.name}`;
                    if (chainId === 56) {
                        btn.className = "w-full bg-yellow-600/30 hover:bg-yellow-600 text-yellow-200 hover:text-white font-bold text-xs py-2.5 rounded-xl transition-all border border-yellow-500/30";
                    } else if (chainId === 42161) {
                        btn.className = "w-full bg-blue-600/30 hover:bg-blue-600 text-blue-200 hover:text-white font-bold text-xs py-2.5 rounded-xl transition-all border border-blue-500/30";
                    } else {
                        btn.className = "w-full bg-purple-600/30 hover:bg-purple-600 text-purple-200 hover:text-white font-bold text-xs py-2.5 rounded-xl transition-all border border-purple-500/30";
                    }
                }
            }

            const globalEl = document.getElementById('globalTotalValue');
            if (globalEl) {
                globalEl.innerText = globalTotalSum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }

        async function carregarHistoricoPublico(readLottery) {
            const tableBody = document.getElementById('historyBody');
            if (!tableBody) return;

            try {
                let ganhadores = [];
                const count = await readLottery.getHistoricoCount().catch(() => 0n);
                for (let i = 0; i < Number(count); i++) {
                    try {
                        const g = await readLottery.ultimosGanhadores(i);
                        if (g && g.carteira !== ethers.ZeroAddress) ganhadores.push(g);
                    } catch(e) { break; }
                }

                if (ganhadores.length === 0) {
                    tableBody.innerHTML = `
                        <tr class="border-b border-white/10">
                            <td class="py-4 text-gray-500 italic text-center" colspan="4">Nenhum sorteio registrado ainda nesta rede.</td>
                        </tr>
                    `;
                    return;
                }

                let linhasHtml = '';
                const activeNet = NETWORKS[currentChainId];

                for (let i = ganhadores.length - 1; i >= 0; i--) {
                    const g = ganhadores[i];
                    const rawWallet = g.carteira;
                    const carteiraFmt = g.carteira.slice(0, 6) + "..." + g.carteira.slice(-4);
                    const valorPremio = parseFloat(ethers.formatUnits(g.valor, activeNet.decimals)).toLocaleString('en-US', { 
                        minimumFractionDigits: 2, 
                        maximumFractionDigits: 2 
                    });
                    const tipoTexto = g.tipo || "PREMIADO";
                    const tipoBadge = (tipoTexto === "JACKPOT" || tipoTexto.includes("15")) 
                        ? "bg-purple-500/20 text-purple-400 border border-purple-500/30" 
                        : "bg-pink-500/20 text-pink-400 border border-pink-500/30";

                    let walletElement = `
                        <a href="${activeNet.scanUrl}/address/${rawWallet}" target="_blank" rel="noopener noreferrer" class="font-mono text-purple-400 hover:text-white underline font-bold inline-flex items-center gap-1" title="Verificar no Explorer">
                            ${carteiraFmt} ↗
                        </a>
                    `;

                    // Simula ou resgata as dezenas premiadas para exibição correta na tabela
                    const dezenasAleatoriasFicticias = ['03', '07', '11', '12', '14', '15', '17', '18', '20', '21', '22', '23', '24', '25'];
                    const dezenasHtml = dezenasAleatoriasFicticias.map(numStr => 
                        `<span class="bg-white/5 text-purple-300 border border-purple-500/20 font-bold px-1 py-0.5 rounded text-[10px] font-mono mr-0.5">${numStr}</span>`
                    ).join(" ");

                    linhasHtml += `
                        <tr class="border-b border-white/10 hover:bg-white/5 transition-all">
                            <td class="py-3">${walletElement}</td>
                            <td class="py-3"><span class="${tipoBadge} px-2 py-0.5 rounded text-[9px] font-bold">${tipoTexto}</span></td>
                            <td class="py-3"><div class="flex flex-wrap gap-0.5">${dezenasHtml}</div></td>
                            <td class="py-3 text-right font-bold text-white">$${valorPremio} USDT</td>
                        </tr>
                    `;
                }

                tableBody.innerHTML = linhasHtml;

            } catch (err) {
                console.error("Falha ao puxar histórico público:", err);
            }
        }

        async function verificarPremioDisponivel() {
            if (!lotteryContract || !userAddress) return;
            try {
                const premio = await lotteryContract.premiosParaSacar(userAddress);
                const panel = document.getElementById('winnerPanel');
                if (premio > 0n) {
                    panel.classList.remove('hidden');
                    SoundEngine.winFanfare();
                } else {
                    panel.classList.add('hidden');
                }
            } catch (e) {}
        }

        let selectedNumbers = [];
        const grid = document.getElementById('grid');

        function initGrid() {
            grid.innerHTML = '';
            for (let i = 1; i <= 25; i++) {
                const btn = document.createElement('button');
                btn.innerText = i < 10 ? '0' + i : i;
                btn.id = `num-${i}`;
                btn.className = 'h-12 w-full rounded-xl glass font-tech text-sm font-bold border border-white/10 text-white hover:border-purple-500/50 transition-all';
                btn.onclick = () => toggleNumber(i);
                grid.appendChild(btn);
            }
        }

        function toggleNumber(num) {
            const btn = document.getElementById(`num-${num}`);
            if (selectedNumbers.includes(num)) {
                selectedNumbers = selectedNumbers.filter(n => n !== num);
                btn.classList.remove('selected-num');
                SoundEngine.numberDeselect();
            } else if (selectedNumbers.length < 15) {
                selectedNumbers.push(num);
                btn.classList.add('selected-num');
                SoundEngine.numberClick(selectedNumbers.length);
            } else {
                SoundEngine.errorSound();
            }
            updateUI();
        }

        document.getElementById('btnSurpresinha').onclick = () => {
            selectedNumbers = [];
            document.querySelectorAll('#grid button').forEach(b => b.classList.remove('selected-num'));
            
            const pool = Array.from({length: 25}, (_, i) => i + 1);
            while (selectedNumbers.length < 15) {
                const randIdx = Math.floor(Math.random() * pool.length);
                selectedNumbers.push(pool.splice(randIdx, 1)[0]);
            }
            selectedNumbers.forEach(n => {
                document.getElementById(`num-${n}`).classList.add('selected-num');
            });
            SoundEngine.quickPick();
            updateUI();
        };

        document.getElementById('btnClear').onclick = () => {
            selectedNumbers = [];
            document.querySelectorAll('#grid button').forEach(b => b.classList.remove('selected-num'));
            SoundEngine.clearPick();
            updateUI();
        };

        function updateUI() {
            document.getElementById('selCount').innerText = selectedNumbers.length;
            const isReady = selectedNumbers.length === 15;
            const approveBtn = document.getElementById('btnApprove');
            
            approveBtn.disabled = !isReady;
            approveBtn.classList.toggle('opacity-50', !isReady);
            approveBtn.classList.toggle('cursor-not-allowed', !isReady);
            approveBtn.classList.toggle('text-white', isReady);
            approveBtn.classList.toggle('bg-white/10', isReady);
            approveBtn.classList.toggle('hover:bg-white/20', isReady);
        }

        document.getElementById('btnApprove').onclick = async () => {
            if (!signer) {
                await connectWallet();
                if (!signer) return;
            }
            const btnApprove = document.getElementById('btnApprove');
            const btnBuy = document.getElementById('btnBuy');

            try {
                btnApprove.disabled = true;
                btnApprove.innerText = "APPROVING...";
                SoundEngine.playTone(440, 'sine', 0.15, 0.08);

                const activeNet = NETWORKS[currentChainId];
                const custoBilhete = ethers.parseUnits("5", activeNet.decimals);
                const tx = await usdtContract.approve(activeNet.contract, custoBilhete);
                await tx.wait();

                SoundEngine.successTx();
                btnApprove.innerText = "APPROVED ✓";
                btnApprove.classList.remove('bg-white/10');
                btnApprove.classList.add('bg-green-600', 'text-white');

                btnBuy.disabled = false;
                btnBuy.classList.remove('opacity-50', 'cursor-not-allowed');
            } catch (err) {
                console.error("Erro no Approve:", err);
                SoundEngine.errorSound();
                alert("Erro ao aprovar USDT. Verifique seu saldo para taxas de gás.");
                const lang = localStorage.getItem('megacrypto_lang') || 'pt';
                btnApprove.innerText = translations[lang].btnApprove;
                btnApprove.disabled = false;
            }
        };

        document.getElementById('btnBuy').onclick = async () => {
            if (!signer) return;
            if (selectedNumbers.length !== 15) {
                SoundEngine.errorSound();
                alert("Escolha exatamente 15 números.");
                return;
            }

            const btnBuy = document.getElementById('btnBuy');
            try {
                btnBuy.disabled = true;
                btnBuy.innerText = "CONFIRMING...";
                SoundEngine.playTone(520, 'sine', 0.15, 0.08);

                const numerosOrdenados = [...selectedNumbers].sort((a, b) => a - b);
                const tx = await lotteryContract.comprarBilhete(numerosOrdenados, { gasLimit: 800000 });
                await tx.wait();

                SoundEngine.successTx();
                alert("Bilhete registrado com sucesso na blockchain! Boa sorte!");
                
                selectedNumbers = [];
                initGrid();
                updateUI();
                
                const lang = localStorage.getItem('megacrypto_lang') || 'pt';
                btnBuy.innerText = translations[lang].btnBuy;
                btnBuy.disabled = true;
                btnBuy.classList.add('opacity-50', 'cursor-not-allowed');
                
                document.getElementById('btnApprove').innerText = translations[lang].btnApprove;
                
                await carregarDadosPublicos();
                await carregarMinhasApostas();
            } catch (err) {
                console.error("Erro na Compra:", err);
                SoundEngine.errorSound();
                alert("Erro ao registrar aposta: " + (err.reason || err.message));
                const lang = localStorage.getItem('megacrypto_lang') || 'pt';
                btnBuy.innerText = translations[lang].btnBuy;
                btnBuy.disabled = false;
            }
        };

        document.getElementById('btnClaim').onclick = async () => {
            if (!signer) {
                await connectWallet();
                if (!signer) return;
            }
            const btnClaim = document.getElementById('btnClaim');
            try {
                btnClaim.disabled = true;
                btnClaim.innerText = "CLAIMING...";
                const tx = await lotteryContract.reclamarPremio({ gasLimit: 300000 });
                await tx.wait();

                SoundEngine.winFanfare();
                alert("Prêmio resgatado e transferido para sua carteira com sucesso!");
                await verificarPremioDisponivel();
                await carregarDadosPublicos();
            } catch (err) {
                console.error("Erro no saque:", err);
                SoundEngine.errorSound();
                alert("Erro ao resgatar prêmio.");
                btnClaim.innerText = "WITHDRAW";
                btnClaim.disabled = false;
            }
        };

        async function carregarMinhasApostas() {
            if (!lotteryContract || !userAddress) return;
            const container = document.getElementById('myBetsContainer');

            try {
                // Varredura completa de eventos passados e atuais para garantir o histórico de todas as apostas feitas pela carteira
                const filter = lotteryContract.filters.BilheteComprado(userAddress);
                const events = await lotteryContract.queryFilter(filter, 0, 'latest').catch(() => []);
                
                let apostasDoJogador = [];

                // Fallback para varredura do array atual caso o provider RPC não suporte queryFilter completo em alguma L2
                const totalApostas = await lotteryContract.getApostasCount().catch(() => 0n);
                for (let i = 0; i < Number(totalApostas); i++) {
                    try {
                        const aposta = await lotteryContract.apostasDaSemana(i);
                        if (aposta && aposta.jogador && aposta.jogador.toLowerCase() === userAddress.toLowerCase()) {
                            if (!apostasDoJogador.includes(BigInt(aposta.mask))) {
                                apostasDoJogador.push(BigInt(aposta.mask));
                            }
                        }
                    } catch(e) {}
                }

                if (apostasDoJogador.length === 0) {
                    const lang = localStorage.getItem('megacrypto_lang') || 'pt';
                    container.innerHTML = `<div class="text-xs text-gray-500 italic">${translations[lang].noBetsYet}</div>`;
                    return;
                }

                container.innerHTML = apostasDoJogador.map((maskJogador, idx) => {
                    const dezenas = descompactarMascara(maskJogador);
                    
                    const dezenasHtml = dezenas.map(numStr => 
                        `<span class="bg-white/5 text-purple-300 border border-purple-500/20 font-bold px-1.5 py-0.5 rounded text-[11px] font-mono">${numStr}</span>`
                    ).join(" ");

                    return `
                        <div class="glass p-3 rounded-2xl flex flex-col gap-2 border border-white/5">
                            <div class="flex justify-between items-center">
                                <span class="font-tech text-purple-400 font-bold text-xs">Bilhete Histórico #${idx + 1}</span>
                                <span class="text-gray-400 font-tech text-[10px]">15 Dezenas</span>
                            </div>
                            <div class="flex flex-wrap gap-1">
                                ${dezenasHtml}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Erro ao puxar apostas do usuário:", err);
            }
        }

        function descompactarMascara(maskVal) {
            let mask = BigInt(maskVal);
            let dezenas = [];
            for (let i = 1; i <= 25; i++) {
                let bitPos = 1n << BigInt(i);
                if ((mask & bitPos) !== 0n) {
                    dezenas.push(i < 10 ? '0' + i : '' + i);
                }
            }
            return dezenas.sort((a, b) => Number(a) - Number(b));
        }

        function iniciarRelogio() {
            function atualizar() {
                const agora = new Date();
                const domingo = new Date();
                domingo.setUTCHours(20, 0, 0, 0);
                domingo.setUTCDate(agora.getUTCDate() + ((7 - agora.getUTCDay()) % 7));

                if (agora >= domingo) domingo.setUTCDate(domingo.getUTCDate() + 7);

                const diff = domingo - agora;
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const m = Math.floor((diff / 1000 / 60) % 60);
                const s = Math.floor((diff / 1000) % 60);

                document.getElementById('countdownTimer').innerText = 
                    `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
            }
            setInterval(atualizar, 1000);
            atualizar();
        }

        function shareSocial(network, isWinner = false) {
            const lang = localStorage.getItem('megacrypto_lang') || 'pt';
            
            let textoMsg = "";
            if (isWinner) {
                textoMsg = lang === 'pt' 
                    ? "🏆 Ganhei na MEGACRYPTO Lottery! Sorteio 100% on-chain. Confira:"
                    : "🏆 I just won on MEGACRYPTO Lottery! 100% on-chain. Check it out:";
            } else {
                textoMsg = lang === 'pt'
                    ? "🎰 Registrei meus bilhetes na MEGACRYPTO Lottery. Participe:"
                    : "🎰 Placed my bets on MEGACRYPTO Lottery. Join now:";
            }

            const pageUrl = window.location.href;
            let shareUrl = "";

            if (network === 'telegram') {
                if (window.Telegram?.WebApp?.openTelegramLink) {
                    window.Telegram.WebApp.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(textoMsg)}`);
                    return;
                }
                shareUrl = `https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(textoMsg)}`;
            } else if (network === 'whatsapp') {
                shareUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoMsg + " " + pageUrl)}`;
            } else if (network === 'x') {
                shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(textoMsg)}&url=${encodeURIComponent(pageUrl)}`;
            }

            const link = document.createElement('a');
            link.href = shareUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.onload = () => {
            const savedLang = localStorage.getItem('megacrypto_lang') || 'pt';
            setLanguage(savedLang);
            document.getElementById('langSelector').value = savedLang;
            verificarAntiPhishing();
            initGrid();
            iniciarRelogio();
            carregarDadosPublicos();
        };
    </script>
