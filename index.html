<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEGACRYPTO Lottery</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151a23;
      --primary: #00d26a;
      --primary-hover: #00b058;
      --accent: #f59e0b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #232d3f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .title { font-size: 24px; font-weight: 800; color: #fff; }
    .title span { color: var(--primary); }
    
    .btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--border); color: #fff; }
    .btn-secondary:hover { background: #2f3e58; }
    .btn-tg { background: #229ED9; color: #fff; }
    .btn-tg:hover { background: #1b87ba; }

    /* Timer */
    .timer-box { text-align: center; border: 1px solid var(--border); background: #0f131a; border-radius: 10px; padding: 15px; }
    .timer-val { font-size: 28px; font-weight: 800; color: var(--accent); letter-spacing: 2px; }

    /* Number Grid */
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
    .num-btn { background: #1c2331; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 16px; }
    .num-btn.selected { background: var(--primary); color: #000; border-color: var(--primary); }

    /* Lists */
    .ticket-list, .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; margin-top: 15px; }
    .item-row { background: #0f131a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .badge { background: #222c3d; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="card header">
    <div class="title">MEGA<span>CRYPTO</span></div>
    <div>
      <button id="btnConnect" class="btn" onclick="conectarCarteira()">Conectar Carteira</button>
      <span id="walletAddress" class="badge" style="display: none;"></span>
    </div>
  </div>

  <!-- Countdown Timer -->
  <div class="card timer-box">
    <div style="font-size: 14px; color: var(--text-muted); margin-bottom: 5px;">PRÓXIMO SORTEIO (DOMINGO)</div>
    <div id="countdown" class="timer-val">00d 00h 00m 00s</div>
  </div>

  <!-- Cartela de Apostas -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Escolha 15 Números (ou Surpresinha)</h3>
      <div id="counter">Selecionados: 0/15</div>
    </div>

    <div class="grid" id="gridNumeros"></div>

    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
      <button class="btn-secondary btn" onclick="gerarSurpresinha()">Surpresinha (Aleatório)</button>
      <button class="btn-secondary btn" onclick="limparSelecao()">Limpar</button>
      <button id="btnComprar" class="btn" style="flex-grow: 1;" onclick="comprarBilhete()">Comprar Bilhete ($5 USDT)</button>
    </div>
  </div>

  <!-- Meus Bilhetes & Compartilhar -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Minhas Apostas da Semana</h3>
      <button class="btn btn-tg" onclick="compartilharTelegram()">Compartilhar no Telegram</button>
    </div>
    <div id="meusBilhetes" class="ticket-list">
      <div style="color: var(--text-muted);">Conecte sua carteira para carregar suas apostas.</div>
    </div>
  </div>

  <!-- Últimos Resultados -->
  <div class="card">
    <h3>Últimos Sorteios</h3>
    <div id="historicoSorteios" class="history-list">
      <div style="color: var(--text-muted);">Nenhum histórico carregado ainda.</div>
    </div>
  </div>
</div>

<script>
  const CONTRACT_ADDRESS = "0x171cc5E40fDeF437DF062D36d082E92eE41b132C";
  const USDT_ADDRESS = "0xc2132D05D31c914a87C6611C10748AEb04B58e8F";

  const ABI = [
    "function apostar(uint32 mask) external",
    "function getApostasCount() external view returns (uint256)",
    "function apostasDaSemana(uint256) external view returns (address jogador, uint32 numerosMask)",
    "function getHistoricoCount() external view returns (uint256)",
    "function historicoSorteios(uint256) external view returns (uint256 idConcurso, uint256 dataSorteio, uint32 numerosSorteadosMask, uint256 totalJackpot, uint256 totalSemanal, uint256 ganhadoresJackpot, uint256 ganhadoresSemanal, bool acumulouJackpot)"
  ];
  const ERC20_ABI = [
    "function approve(address spender, uint256 amount) external returns (bool)",
    "function allowance(address owner, address spender) external view returns (uint256)"
  ];

  let provider, signer, lotteryContract, usdtContract, userAddress;
  let selectedNumbers = new Set();

  // 1. Grid Generator
  const grid = document.getElementById("gridNumeros");
  for (let i = 1; i <= 25; i++) {
    const btn = document.createElement("button");
    btn.className = "num-btn";
    btn.innerText = i < 10 ? "0" + i : i;
    btn.onclick = () => alternarNumero(i, btn);
    btn.id = `num-${i}`;
    grid.appendChild(btn);
  }

  function alternarNumero(num, btn) {
    if (selectedNumbers.has(num)) {
      selectedNumbers.delete(num);
      btn.classList.remove("selected");
    } else {
      if (selectedNumbers.size >= 15) return alert("Você já selecionou o limite de 15 números!");
      selectedNumbers.add(num);
      btn.classList.add("selected");
    }
    atualizarContador();
  }

  function atualizarContador() {
    document.getElementById("counter").innerText = `Selecionados: ${selectedNumbers.size}/15`;
  }

  function limparSelecao() {
    selectedNumbers.clear();
    document.querySelectorAll(".num-btn").forEach(b => b.classList.remove("selected"));
    atualizarContador();
  }

  function gerarSurpresinha() {
    limparSelecao();
    while (selectedNumbers.size < 15) {
      const r = Math.floor(Math.random() * 25) + 1;
      selectedNumbers.add(r);
    }
    selectedNumbers.forEach(n => document.getElementById(`num-${n}`).classList.add("selected"));
    atualizarContador();
  }

  // 2. Conectar Carteira
  async function conectarCarteira() {
    if (!window.ethereum) return alert("Instale a MetaMask!");
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();
    
    lotteryContract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    usdtContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, signer);

    document.getElementById("btnConnect").style.display = "none";
    const wSpan = document.getElementById("walletAddress");
    wSpan.style.display = "inline-block";
    wSpan.innerText = `${userAddress.substring(0,6)}...${userAddress.substring(38)}`;

    carregarMinhasApostas();
    carregarHistorico();
  }

  // 3. Comprar Bilhete
  async function comprarBilhete() {
    if (!signer) return alert("Conecte sua carteira primeiro!");
    if (selectedNumbers.size !== 15) return alert("Selecione exatamente 15 números!");

    let mask = 0;
    selectedNumbers.forEach(n => { mask |= (1 << (n - 1)); });

    try {
      const preco = ethers.parseUnits("5", 6);
      const allowance = await usdtContract.allowance(userAddress, CONTRACT_ADDRESS);
      if (allowance < preco) {
        const txApprove = await usdtContract.approve(CONTRACT_ADDRESS, preco);
        await txApprove.wait();
      }

      const tx = await lotteryContract.apostar(mask, { gasLimit: 800000 });
      alert("Transação enviada! Aguardando confirmação...");
      await tx.wait();
      alert("Aposta confirmada com sucesso!");
      carregarMinhasApostas();
    } catch (err) {
      console.error(err);
      alert("Erro ao enviar aposta: " + (err.reason || err.message));
    }
  }

  // 4. Carregar Apostas da Carteira
  async function carregarMinhasApostas() {
    if (!lotteryContract) return;
    const container = document.getElementById("meusBilhetes");
    container.innerHTML = "Carregando...";

    try {
      const count = await lotteryContract.getApostasCount();
      let apostasUser = [];

      for (let i = 0; i < count; i++) {
        const aposta = await lotteryContract.apostasDaSemana(i);
        if (aposta.jogador.toLowerCase() === userAddress.toLowerCase()) {
          apostasUser.push(descompactarMascara(Number(aposta.numerosMask)));
        }
      }

      if (apostasUser.length === 0) {
        container.innerHTML = "<div style='color: var(--text-muted);'>Nenhuma aposta encontrada para esta rodada.</div>";
        return;
      }

      container.innerHTML = apostasUser.map((nums, idx) => `
        <div class="item-row">
          <span><b>Bilhete #${idx + 1}</b></span>
          <span class="badge">${nums.join(" - ")}</span>
        </div>
      `).join("");
    } catch (e) {
      container.innerHTML = "<div style='color: var(--text-muted);'>Erro ao carregar apostas.</div>";
    }
  }

  // 5. Histórico Público de Sorteios
  async function carregarHistorico() {
    const container = document.getElementById("historicoSorteios");
    if (!lotteryContract) return;

    try {
      const total = await lotteryContract.getHistoricoCount();
      if (total == 0) {
        container.innerHTML = "<div style='color: var(--text-muted);'>Nenhum sorteio registrado ainda.</div>";
        return;
      }

      let html = "";
      for (let i = Number(total) - 1; i >= 0; i--) {
        const sorteio = await lotteryContract.historicoSorteios(i);
        const nums = descompactarMascara(Number(sorteio.numerosSorteadosMask));
        const data = new Date(Number(sorteio.dataSorteio) * 1000).toLocaleDateString("pt-BR");
        
        html += `
          <div class="item-row">
            <div>
              <div><b>Concurso #${sorteio.idConcurso.toString()}</b> (${data})</div>
              <div style="font-size: 12px; color: var(--text-muted);">${sorteio.acumulouJackpot ? "Acumulou!" : "Jackpot Premiado!"}</div>
            </div>
            <span class="badge">${nums.join(" - ")}</span>
          </div>
        `;
      }
      container.innerHTML = html;
    } catch (err) {
      console.error(err);
    }
  }

  function descompactarMascara(mask) {
    let dezenas = [];
    for (let i = 1; i <= 25; i++) {
      if ((mask & (1 << (i - 1))) !== 0) {
        dezenas.push(i < 10 ? "0" + i : "" + i);
      }
    }
    return dezenas;
  }

  // 6. Relógio Regressivo (Domingo 20h UTC)
  function atualizarRelogio() {
    const agora = new Date();
    const domingo = new Date();
    domingo.setUTCHours(20, 0, 0, 0);
    domingo.setUTCDate(agora.getUTCDate() + ((7 - agora.getUTCDay()) % 7));

    if (agora >= domingo) domingo.setUTCDate(domingo.getUTCDate() + 7);

    const diff = domingo - agora;
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / 1000 / 60) % 60);
    const s = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerText = 
      `${String(d).padStart(2,'0')}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
  }
  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();

  // 7. Botão Telegram
  function compartilharTelegram() {
    const msg = encodeURIComponent("🎰 Acabei de registrar meus bilhetes na MEGACRYPTO Lottery! Sorteio auditado via Chainlink VRF com Jackpot em USDT. Participe também:");
    const url = encodeURIComponent(window.location.href);
    window.open(`https://t.me/share/url?url=${url}&text=${msg}`, '_blank');
  }
</script>
</body>
</html>
